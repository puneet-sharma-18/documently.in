name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: node scripts/validate-presets.mjs
      - name: Type-check Pages Functions
        run: npx tsc --noEmit -p functions/tsconfig.json
      - name: Build (runs postbuild checks)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
