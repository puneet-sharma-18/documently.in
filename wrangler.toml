# Cloudflare Pages project config (static export in out/ + Pages Functions in functions/).
name = "documently"
compatibility_date = "2026-10-01"
pages_build_output_dir = "out"

[[d1_databases]]
binding = "DB"
database_name = "documently"
# Created 2026-10-31 (APAC).
# Local dev (`wrangler pages dev`) works with this placeholder.
database_id = "394dc904-c7fa-40fb-af89-64f2738ff1d6"

# ADMIN_TOKEN is a secret: set it in Cloudflare Pages > Settings > Variables and Secrets
